[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralresearcher"
version = "0.1.0"
description = "Terminal-based, PyPI-distributed multi-agent research planner for ML/CS topics."
readme = "README.md"
authors = [
    { name = "neuralresearcher Authors" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "groq>=0.4.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
neuralresearcher = "neuralresearcher.cli:app"

[tool.setuptools]
packages = ["neuralresearcher"]
