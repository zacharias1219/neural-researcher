[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False

# External libraries without stubs
[mypy-groq.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

# Modules with complex LLM/tool logic that are not on the critical release path
[mypy-neuralresearcher.llm]
ignore_errors = True

[mypy-neuralresearcher.tools]
ignore_errors = True

[mypy-neuralresearcher.agents.topic_scope]
ignore_errors = True

[mypy-neuralresearcher.agents.reporting]
ignore_errors = True

[mypy-neuralresearcher.agents.coverage]
ignore_errors = True

[mypy-neuralresearcher.agents.retrieval]
ignore_errors = True

[mypy-neuralresearcher.plan_validation]
ignore_errors = True
